<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>실시간 채팅방</title>

    <meta name="description"
          content="회원가입 없이 닉네임만으로 참여할 수 있는 실시간 채팅방입니다.">

    <meta name="keywords"
          content="실시간 채팅, 채팅방, 무료 채팅, 온라인 채팅">

    <meta name="robots"
          content="index, follow">

    <meta property="og:title"
          content="실시간 채팅방">

    <meta property="og:description"
          content="닉네임만 입력하고 바로 참여하는 실시간 채팅">

    <meta property="og:type"
          content="website">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <header class="topbar">

        <div>
            <h1>실시간 채팅</h1>
            <p>새로고침 없이 바로 대화하세요.</p>
        </div>

        <div class="online">
            <span class="online-dot"></span>
            <span id="onlineCount">0</span>명 접속 중
        </div>

    </header>


    <main class="chat">

        <div id="messages" class="messages">
        </div>

    </main>


    <form id="messageForm" class="input-area">

        <input
            id="messageInput"
            type="text"
            maxlength="500"
            placeholder="메시지를 입력하세요..."
            autocomplete="off"
        >

        <button type="submit">
            전송
        </button>

    </form>

</div>


<!-- 닉네임 입력창 -->

<div id="nicknameModal" class="modal">

    <div class="modal-box">

        <h2>채팅방에 들어오기</h2>

        <p>
            사용할 닉네임을 입력해주세요.
        </p>

        <form id="nicknameForm">

            <input
                id="nicknameInput"
                type="text"
                maxlength="20"
                placeholder="닉네임"
                autocomplete="off"
            >

            <button type="submit">
                입장하기
            </button>

        </form>

    </div>

</div>


<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
